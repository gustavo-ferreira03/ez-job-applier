<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EZJobApplier</title>
  <style>
    * { box-sizing: border-box; }
    :root { --bg:#0c1120; --surface:#111827; --surface-2:#1e293b; --border:#1e2d45; --border-hi:#334155; --text:#f1f5f9; --muted:#94a3b8; --dim:#64748b; --blue:#38bdf8; --green:#4ade80; --yellow:#fbbf24; --red:#f87171; --r:12px; --r-sm:8px; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,sans-serif; }
    .topbar { position:sticky; top:0; z-index:50; height:52px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 28px; }
    .logo { font-weight:800; letter-spacing:-.02em; }
    .logo span { color:var(--blue); }
    .pill { margin-left:auto; display:inline-flex; gap:6px; align-items:center; padding:4px 11px; border-radius:99px; background:var(--surface-2); color:var(--muted); font-size:12px; font-weight:700; }
    .pill::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--border-hi); }
    .pill.running { background:#0c2d4a; color:var(--blue); }
    .pill.running::before { background:var(--blue); animation:blink 1.4s infinite; }
    @keyframes blink { 50% { opacity:.25; } }
    main { max-width:1220px; margin:0 auto; padding:18px; }
    .grid { display:grid; grid-template-columns:minmax(0, 1fr) max-content; gap:14px; align-items:start; }
    .main { display:grid; gap:14px; }
    .jobs-rail { position:sticky; top:70px; max-height:calc(100vh - 88px); display:flex; flex-direction:column; }
    .jobs-rail .bd { overflow:auto; padding:10px; }
    @media (max-width:980px) { .grid { grid-template-columns:1fr; } .jobs-rail { position:static; max-height:none; } }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; }
    .card.alert { border-color:#fbbf2450; }
    .hd { min-height:42px; padding:11px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
    .hd h2 { margin:0; color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.07em; }
    .bd { padding:16px; }
    .count { padding:1px 7px; border-radius:99px; background:var(--surface-2); color:var(--muted); font-size:11px; font-weight:800; }
    .form-grid { display:grid; grid-template-columns:1.4fr repeat(4,minmax(120px,.7fr)); gap:10px; align-items:end; }
    .f { display:flex; flex-direction:column; gap:5px; }
    .f.w2 { grid-column:span 2; }
    .f > span, .field label { color:var(--dim); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; }
    small { color:var(--muted); font-weight:400; text-transform:none; }
    input, select, textarea { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border-hi); border-radius:var(--r-sm); padding:8px 11px; font:inherit; }
    textarea { min-height:44px; resize:vertical; }
    input:focus, select:focus, textarea:focus { outline:0; border-color:var(--blue); box-shadow:0 0 0 3px #38bdf818; }
    .btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    button { border:0; border-radius:var(--r-sm); padding:8px 16px; cursor:pointer; font-weight:700; }
    button:hover { filter:brightness(1.12); }
    button:disabled { cursor:wait; opacity:.62; filter:none; }
    .primary { background:var(--blue); color:#04243a; }
    .ghost { background:var(--surface-2); color:var(--muted); border:1px solid var(--border-hi); }
    .danger { background:#3b0a0a; color:var(--red); border:1px solid #7f1d1d; }
    .ok { background:#0d2e1a; color:var(--green); border:1px solid #166534; }
    .action { background:var(--surface-2); border:1px solid var(--border-hi); border-radius:var(--r-sm); padding:12px 14px; }
    .action.busy { border-color:#38bdf866; }
    .action + .action { margin-top:8px; }
    .title { font-weight:700; }
    .sub { color:var(--muted); font-size:12px; margin-bottom:8px; }
    .field { margin-bottom:8px; }
    .actions { display:flex; gap:8px; margin-top:12px; }
    .empty { color:var(--dim); font-size:13px; margin:0; }
    .job-list { display:grid; gap:8px; }
    .job-card { width:320px; min-height:86px; padding:10px 11px; background:var(--bg); border:1px solid var(--border); border-radius:var(--r-sm); cursor:pointer; }
    .job-card:hover { background:var(--surface-2); border-color:var(--border-hi); }
    .job-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
    .job-title { max-width:220px; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; font-weight:700; line-height:1.25; }
    .job-meta, .job-time { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:var(--muted); font-size:12px; margin-top:4px; }
    .job-time { color:var(--dim); font-size:11px; margin-top:7px; }
    .badge { display:inline-flex; align-items:center; border-radius:99px; padding:2px 8px; background:var(--surface-2); color:var(--muted); font-size:11px; font-weight:800; white-space:nowrap; }
    .s-FOUND { background:#1e293b; color:var(--muted); } .s-ANALYZING { background:#0c1f3d; color:var(--blue); } .s-NEEDS_ANSWERS { background:#2d1500; color:#fde68a; } .s-READY_FOR_REVIEW { background:#0c1f3d; color:#93c5fd; } .s-SUBMITTED { background:#0d2e1a; color:#86efac; } .s-SKIPPED { background:#1c1917; color:#a8a29e; } .s-FAILED { background:#300a0a; color:#fca5a5; }
    .overlay { display:none; position:fixed; inset:0; z-index:200; background:#0009; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; backdrop-filter:blur(4px); }
    .overlay.open { display:flex; }
    .modal { position:relative; width:100%; max-width:760px; background:#131e33; border:1px solid var(--border-hi); border-radius:16px; overflow:hidden; }
    .modal-hd { padding:24px 28px 18px; border-bottom:1px solid var(--border); }
    .modal-hd h3 { margin:0 36px 8px 0; }
    .modal-bd { padding:22px 28px 28px; }
    .close { position:absolute; top:18px; right:20px; width:28px; height:28px; padding:0; background:var(--surface-2); color:var(--muted); border:1px solid var(--border-hi); }
    .section { margin-top:20px; } .section-name { color:var(--dim); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; margin-bottom:8px; }
    .box { max-height:260px; overflow:auto; white-space:pre-wrap; background:var(--bg); border:1px solid var(--border); border-radius:var(--r-sm); padding:14px; color:var(--muted); }
    .chips, .qa-grid { display:flex; flex-wrap:wrap; gap:6px; }
    .chip, .qa { background:var(--bg); border:1px solid var(--border); border-radius:var(--r-sm); padding:6px 10px; }
    .qa-q { color:var(--dim); font-size:11px; } .qa-a { font-weight:700; }
    .err { background:#1a0505; border:1px solid #7f1d1d; color:var(--red); border-radius:var(--r-sm); padding:12px; }
    .notice { margin:10px 0 0; padding:9px 11px; border-radius:var(--r-sm); border:1px solid #38bdf866; background:#082f49; color:#bae6fd; font-size:12px; font-weight:700; }
    .notice.ok { border-color:#166534; background:#052e16; color:#86efac; }
    .notice.warn { border-color:#92400e; background:#2d1500; color:#fde68a; }
    .toast { position:fixed; right:18px; bottom:18px; z-index:300; max-width:min(420px, calc(100vw - 36px)); padding:11px 14px; border-radius:var(--r-sm); border:1px solid var(--border-hi); background:#131e33; color:var(--text); box-shadow:0 18px 45px #0007; opacity:0; transform:translateY(8px); transition:opacity .16s ease, transform .16s ease; }
    .toast.show { opacity:1; transform:none; }
    input[type=checkbox].toggle { appearance:none; width:36px; height:20px; background:var(--border-hi); border:none; border-radius:99px; padding:0; cursor:pointer; position:relative; transition:background .15s; flex-shrink:0; }
    input[type=checkbox].toggle::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--muted); transition:left .15s, background .15s; }
    input[type=checkbox].toggle:checked { background:var(--blue); }
    input[type=checkbox].toggle:checked::after { left:18px; background:#fff; }
  </style>
</head>
<body>
<header class="topbar"><div class="logo">EZ<span>JobApplier</span></div><div class="pill" id="status">Idle</div></header>
<main>
  <div class="grid">
    <div class="main">
      <section class="card">
        <div class="hd"><h2>Configuration</h2></div>
        <div class="bd">
          <form id="run-form">
            <div class="form-grid">
              <label class="f w2"><span>Keywords <small>(one per line)</small></span><textarea name="keywords" rows="2">python developer junior</textarea></label>
              <label class="f"><span>Location</span><input name="location" value="Brazil"></label>
              <label class="f"><span>Max applications <small>(blank = ∞)</small></span><input name="max_apply" type="number" min="1" placeholder="unlimited"></label>
              <label class="f"><span>Easy Apply</span><select name="easy_apply"><option value="true">Yes</option><option value="false">No</option></select></label>
              <label class="f"><span>Work type</span><select name="work_type"><option value="">Any</option><option value="remote">Remote</option><option value="hybrid">Hybrid</option><option value="onsite">On-site</option><option value="remote,hybrid">Remote + Hybrid</option></select></label>
              <label class="f"><span>Fill skill gaps</span><input type="checkbox" name="fill_skill_gaps" class="toggle"></label>
            </div>
            <div class="btn-row"><button class="primary" id="btn-start">Start</button><button class="danger" type="button" id="btn-cancel" hidden>Cancel run</button></div>
          </form>
        </div>
      </section>

      <section class="card" id="section-inputs"><div class="hd"><h2>Pending Questions</h2><span class="count" id="count-inputs">0</span></div><div class="bd" id="inputs"><p class="empty">No pending questions.</p></div></section>
      <section class="card" id="section-submits"><div class="hd"><h2>Submit Approvals</h2><span class="count" id="count-submits">0</span></div><div class="bd" id="submits"><p class="empty">No pending approvals.</p></div></section>
    </div>

    <aside class="card jobs-rail"><div class="hd"><h2>Jobs</h2><span class="count" id="count-jobs">0</span><span style="margin-left:auto;font-size:11px;color:var(--dim)">click for details</span></div><div class="bd"><div class="job-list" id="jobs"></div></div></aside>
  </div>
</main>

<div class="overlay" id="modal-overlay"><div class="modal"><button class="close" id="modal-close">x</button><div class="modal-hd" id="modal-hd"></div><div class="modal-bd" id="modal-bd"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
  const S = { pending: [], review: [], jobs: [], running: false, busy: {}, feedback: {} };
  const $ = id => document.getElementById(id);
  const answerDrafts = {};
  let configApplied = false;
  let runFormDirty = false;
  let refreshSerial = 0;
  let toastTimer;
  let audio;

  function esc(value) { return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function badge(status) { return `<span class="badge s-${status || 'FOUND'}">${String(status || 'FOUND').replace(/_/g, ' ')}</span>`; }
  function fmtTime(iso) { return iso ? new Date(iso + 'Z').toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : ''; }
  function enableAudio() { audio ||= new AudioContext(); if (audio.state === 'suspended') audio.resume(); }
  function playBell() { if (!audio || audio.state !== 'running') return; const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.001, audio.currentTime); g.gain.exponentialRampToValueAtTime(.2, audio.currentTime+.02); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime+.7); o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+.75); }
  async function post(url, body) { return fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined}); }
  function answerKey(applicationId, label) { return `${applicationId}\u0000${label}`; }
  function hasDraft(applicationId, label) { return Object.prototype.hasOwnProperty.call(answerDrafts, answerKey(applicationId, label)); }
  function answerValue(applicationId, question) { return hasDraft(applicationId, question.label) ? answerDrafts[answerKey(applicationId, question.label)] : (question.answer || ''); }
  function captureDrafts() { document.querySelectorAll('[data-answer-input]').forEach(input => rememberDraft(input.dataset.applicationId, input.dataset.label, input.value)); }
  function rememberDraft(applicationId, label, value) { answerDrafts[answerKey(applicationId, label)] = value; }
  function setBusy(applicationId, type) { S.busy[applicationId] = type; render(); }
  function clearBusy(applicationId) { delete S.busy[applicationId]; }
  function setFeedback(applicationId, type, message) { S.feedback[applicationId] = {type, message}; }
  function clearFeedback(applicationId) { delete S.feedback[applicationId]; }
  function isBusy(applicationId, type) { return S.busy[applicationId] === type; }
  function busyMessage(type) { return {answers:'Saving answers...', approve:'Approving submit...', skip:'Skipping application...'}[type] || 'Working...'; }
  function showToast(message) {
    const toast = $('toast');
    toast.textContent = message;
    toast.hidden = false;
    toast.className = 'toast show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.classList.remove('show'); toast.hidden = true; }, 3200);
  }

  function render() {
    $('status').className = 'pill' + (S.running ? ' running' : '');
    $('status').textContent = S.running ? 'Running' : 'Idle';
    $('btn-start').hidden = S.running;
    $('btn-cancel').hidden = !S.running;
    renderPending();
    renderJobs();
  }

  function renderPending() {
    $('count-inputs').textContent = S.pending.length;
    $('count-submits').textContent = S.review.length;
    $('section-inputs').className = 'card' + (S.pending.length ? ' alert' : '');
    $('section-submits').className = 'card' + (S.review.length ? ' alert' : '');
    $('inputs').innerHTML = S.pending.length ? S.pending.map(app => {
      const busy = S.busy[app.application_id];
      const feedback = S.feedback[app.application_id];
      const answered = feedback?.type === 'answers';
      return `
      <div class="action${busy ? ' busy' : ''}">
        <div class="title">${esc(app.title)}</div><div class="sub">${esc(app.company)}</div>
        ${(app.questions || []).map(q => questionField(app, q, Boolean(busy) || answered)).join('')}
        ${actionNotice(app.application_id)}
        <div class="actions"><button class="primary" onclick="sendAnswers(${app.application_id})" ${busy || answered ? 'disabled' : ''}>${isBusy(app.application_id, 'answers') ? 'Saving...' : answered ? 'Answers saved' : 'Save answers'}</button><button class="ghost" onclick="skipApplication(${app.application_id})" ${busy ? 'disabled' : ''}>${isBusy(app.application_id, 'skip') ? 'Skipping...' : 'Skip'}</button></div>
      </div>`;
    }).join('') : '<p class="empty">No pending questions.</p>';
    $('submits').innerHTML = S.review.length ? S.review.map(app => {
      const busy = S.busy[app.application_id];
      const feedback = S.feedback[app.application_id];
      const approved = feedback?.type === 'approve';
      return `
      <div class="action${busy ? ' busy' : ''}">
        <div class="title">${esc(app.title)}</div><div class="sub">${esc(app.company)}</div>
        ${questionGrid(app.questions || [])}
        ${actionNotice(app.application_id)}
        <div class="actions"><button class="ok" onclick="approveApplication(${app.application_id})" ${busy || approved ? 'disabled' : ''}>${isBusy(app.application_id, 'approve') ? 'Approving...' : approved ? 'Submit approved' : 'Submit application'}</button><button class="ghost" onclick="skipApplication(${app.application_id})" ${busy || approved ? 'disabled' : ''}>${isBusy(app.application_id, 'skip') ? 'Skipping...' : 'Skip'}</button></div>
      </div>`;
    }).join('') : '<p class="empty">No pending approvals.</p>';
  }

  function actionNotice(applicationId) {
    const busy = S.busy[applicationId];
    const feedback = S.feedback[applicationId];
    if (busy) return `<div class="notice warn">${busyMessage(busy)}</div>`;
    if (!feedback) return '';
    return `<div class="notice ok">${esc(feedback.message)}</div>`;
  }

  function questionField(app, question, disabled) {
    const value = answerValue(app.application_id, question);
    const attrs = `data-answer-input data-application-id="${app.application_id}" data-label="${esc(question.label)}" ${disabled ? 'disabled' : ''}`;
    if (question.options?.length) {
      const options = question.options.map(option => `<option value="${esc(option)}" ${option === value ? 'selected' : ''}>${esc(option)}</option>`).join('');
      return `<div class="field"><label>${esc(question.label)}</label><select ${attrs}>${options}</select></div>`;
    }
    return `<div class="field"><label>${esc(question.label)}</label><input ${attrs} value="${esc(value)}" placeholder="Answer"></div>`;
  }

  function renderJobs() {
    $('count-jobs').textContent = S.jobs.length;
    $('jobs').innerHTML = S.jobs.length ? S.jobs.map(job => `
      <div class="job-card" onclick="openJob('${job.job_id}')">
        <div class="job-top"><div class="job-title">${esc(job.title)}</div>${badge(job.status)}</div>
        <div class="job-meta">${esc(job.company)}${job.location ? ' · ' + esc(job.location) : ''}</div>
        <div class="job-time">${fmtTime(job.application_updated_at || job.updated_at)}</div>
      </div>`).join('') : '<p class="empty" style="padding:10px 4px">No jobs yet.</p>';
  }

  function questionGrid(questions) {
    return questions.length ? `<div class="qa-grid">${questions.map(q => `<div class="qa"><div class="qa-q">${esc(q.label)}</div><div class="qa-a">${esc(q.answer || '-')}</div></div>`).join('')}</div>` : '';
  }

  async function sendAnswers(applicationId) {
    const app = S.pending.find(item => item.application_id === applicationId);
    const answers = {};
    document.querySelectorAll(`[data-answer-input][data-application-id="${applicationId}"]`).forEach(input => answers[input.dataset.label] = input.value);
    setBusy(applicationId, 'answers');
    try {
      const response = await post(`/applications/${applicationId}/answers`, {answers});
      if (!response.ok) throw new Error(await response.text());
      clearBusy(applicationId);
      setFeedback(applicationId, 'answers', 'Answers saved. The worker will continue from here.');
      showToast('Answers saved');
      await refreshState();
    } catch (error) {
      clearBusy(applicationId);
      clearFeedback(applicationId);
      render();
      alert(error.message || String(error));
    }
  }

  async function approveApplication(applicationId) {
    setBusy(applicationId, 'approve');
    try {
      const response = await post(`/applications/${applicationId}/approve`);
      if (!response.ok) throw new Error(await response.text());
      clearBusy(applicationId);
      setFeedback(applicationId, 'approve', 'Submit approved. The worker will submit it shortly.');
      showToast('Submit approved');
      await refreshState();
    } catch (error) {
      clearBusy(applicationId);
      clearFeedback(applicationId);
      render();
      alert(error.message || String(error));
    }
  }

  async function skipApplication(applicationId) {
    setBusy(applicationId, 'skip');
    try {
      const response = await post(`/applications/${applicationId}/skip`);
      if (!response.ok) throw new Error(await response.text());
      S.pending = S.pending.filter(item => item.application_id !== applicationId);
      S.review = S.review.filter(item => item.application_id !== applicationId);
      const job = S.jobs.find(item => item.application_id === applicationId);
      if (job) { job.status = 'SKIPPED'; job.application_updated_at = new Date().toISOString().slice(0, 19); }
      clearBusy(applicationId);
      clearFeedback(applicationId);
      showToast('Application skipped');
      render();
      await refreshState();
    } catch (error) {
      clearBusy(applicationId);
      render();
      alert(error.message || String(error));
    }
  }

  async function openJob(jobId) {
    const response = await fetch(`/jobs/${jobId}`);
    if (!response.ok) return;
    const job = await response.json();
    $('modal-hd').innerHTML = `<h3>${esc(job.title)}</h3><div class="sub">${esc(job.company)}${job.location ? ' · ' + esc(job.location) : ''} ${badge(job.status)}</div>`;
    $('modal-bd').innerHTML = `${job.error_message ? `<div class="err">${esc(job.error_message)}</div>` : ''}${section('About the job', job.about ? `<div class="box">${esc(job.about)}</div>` : '')}${section('Preferences', chips(job.preferences))}${section('Skills', chips(job.skills))}${section('Questions', questionGrid(job.questions || []))}`;
    $('modal-overlay').classList.add('open');
  }

  function section(title, body) { return body ? `<div class="section"><div class="section-name">${title}</div>${body}</div>` : ''; }
  function chips(items) { return Array.isArray(items) && items.length ? `<div class="chips">${items.map(item => `<span class="chip">${esc(item)}</span>`).join('')}</div>` : ''; }

  async function refreshState() {
    const serial = ++refreshSerial;
    const response = await fetch('/state');
    if (!response.ok) return;
    const data = await response.json();
    if (serial !== refreshSerial) return;
    captureDrafts();
    S.running = data.run.running;
    S.pending = data.pending_questions || [];
    S.review = data.ready_for_review || [];
    S.jobs = data.jobs || [];
    syncLocalState();
    if (!configApplied || !runFormDirty) applyConfig(data.config || {});
    render();
  }

  function syncLocalState() {
    const visible = new Set([...S.pending, ...S.review].map(app => String(app.application_id)));
    Object.keys(S.feedback).forEach(applicationId => {
      const feedback = S.feedback[applicationId];
      const pendingApp = S.pending.find(app => String(app.application_id) === applicationId);
      const reviewApp = S.review.find(app => String(app.application_id) === applicationId);
      if (!visible.has(applicationId)) clearFeedback(applicationId);
      if (feedback?.type === 'answers' && !pendingApp) clearFeedback(applicationId);
      if (feedback?.type === 'answers' && pendingApp && (pendingApp.questions || []).some(q => !answerValue(applicationId, q))) clearFeedback(applicationId);
      if (feedback?.type === 'approve' && !reviewApp) clearFeedback(applicationId);
    });
    const activeQuestionKeys = new Set();
    S.pending.forEach(app => (app.questions || []).forEach(q => activeQuestionKeys.add(answerKey(app.application_id, q.label))));
    Object.keys(answerDrafts).forEach(key => { if (!activeQuestionKeys.has(key)) delete answerDrafts[key]; });
  }

  function applyConfig(config) {
    if (configApplied && ($('run-form').contains(document.activeElement) || runFormDirty)) return;
    const form = $('run-form');
    if (config.keywords !== undefined) form.elements.keywords.value = config.keywords || '';
    if (config.location !== undefined) form.elements.location.value = config.location || '';
    if (config.max_apply !== undefined) form.elements.max_apply.value = config.max_apply || '';
    if (config.easy_apply !== undefined) form.elements.easy_apply.value = config.easy_apply ? 'true' : 'false';
    if (config.work_type !== undefined) form.elements.work_type.value = config.work_type || '';
    if (config.fill_skill_gaps !== undefined) form.elements.fill_skill_gaps.checked = !!config.fill_skill_gaps;
    configApplied = true;
  }

  document.addEventListener('input', event => { if (event.target.matches('[data-answer-input]')) rememberDraft(event.target.dataset.applicationId, event.target.dataset.label, event.target.value); });
  document.addEventListener('change', event => { if (event.target.matches('[data-answer-input]')) rememberDraft(event.target.dataset.applicationId, event.target.dataset.label, event.target.value); });
  $('run-form').addEventListener('input', () => { runFormDirty = true; });
  $('run-form').addEventListener('change', () => { runFormDirty = true; });
  $('run-form').addEventListener('submit', async event => {
    event.preventDefault();
    enableAudio();
    const payload = Object.fromEntries(new FormData(event.target).entries());
    payload.easy_apply = payload.easy_apply === 'true';
    if (payload.max_apply) payload.max_apply = Number(payload.max_apply); else delete payload.max_apply;
    payload.fill_skill_gaps = event.target.elements.fill_skill_gaps.checked;
    const response = await post('/runs', payload);
    if (!response.ok) alert(await response.text());
    else { runFormDirty = false; showToast('Run started'); }
    await refreshState();
  });
  $('btn-cancel').onclick = async () => { $('btn-cancel').disabled = true; await post('/runs/cancel'); showToast('Run cancellation requested'); await refreshState(); $('btn-cancel').disabled = false; };
  $('modal-close').onclick = () => $('modal-overlay').classList.remove('open');
  $('modal-overlay').onclick = event => { if (event.target === $('modal-overlay')) $('modal-overlay').classList.remove('open'); };
  document.addEventListener('click', enableAudio, {once:true});
  document.addEventListener('keydown', enableAudio, {once:true});
  new EventSource('/events').onmessage = event => { const data = JSON.parse(event.data); if (['application_needs_answers', 'application_ready_for_review'].includes(data.type)) playBell(); refreshState(); };
  refreshState();
</script>
</body>
</html>
